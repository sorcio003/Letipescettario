<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi · IL Letipescettario</title>
  <link rel="icon" href="assets/icons/first_dish.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/pages/login.js"></script>
</head>
<body>
  <main id="main" class="container">
    <section class="auth-card" id="auth">
      <img class="auth-card__logo" src="assets/icons/dessert.png" alt="">

      <div id="auth-forms" hidden>
        <h1 id="auth-title">Entra in cucina</h1>
        <p class="auth-card__intro">Con un account salvi le tue ricette preferite e le ritrovi su ogni dispositivo.</p>

        <div class="auth-tabs" role="tablist" aria-label="Accesso o registrazione">
          <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="auth-form" data-mode="login">Accedi</button>
          <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="auth-form" data-mode="register">Registrati</button>
        </div>

        <form id="auth-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div class="field">
            <label for="username">Nome utente</label>
            <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            <small id="username-help" hidden>3-20 caratteri: lettere minuscole, numeri, punto, trattino o underscore.</small>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div class="field" id="confirm-field" hidden>
            <label for="password2">Ripeti la password</label>
            <input class="input" id="password2" name="password2" type="password" autocomplete="new-password">
          </div>
          <p class="status status--error" id="auth-error" role="alert"></p>
          <button class="btn btn--primary btn--block" type="submit" id="auth-submit">Accedi</button>
        </form>
        <p class="help auth-card__note">Hai dimenticato la password? Al momento non si può reimpostare dal sito: crea un nuovo account.</p>
      </div>

      <div id="auth-message"></div>
    </section>
  </main>
</body>
</html>
